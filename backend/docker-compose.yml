version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: hyperlofy-postgres
    restart: always
    environment:
      POSTGRES_DB: hyperlofy_db
      POSTGRES_USER: hyperlofy_admin
      POSTGRES_PASSWORD: HyperlofySecurePass2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperlofy_admin -d hyperlofy_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperlofy-network

  # 2. Redis Cache & Messaging Broker
  redis:
    image: redis:7-alpine
    container_name: hyperlofy-redis
    restart: always
    command: redis-server --appendonly yes --requirepass HyperlofyRedisPass2026!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "HyperlofyRedisPass2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperlofy-network

  # 3. Hyperlofy Backend Application Instance
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperlofy-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hyperlofy_db
      SPRING_DATASOURCE_USERNAME: hyperlofy_admin
      SPRING_DATASOURCE_PASSWORD: HyperlofySecurePass2026!
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: HyperlofyRedisPass2026!
      JWT_SECRET: hyperlofy_production_super_secret_jwt_signing_key_2026_min_256_bits_length!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hyperlofy-network

  # 4. Prometheus Monitoring Metrics Collector
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hyperlofy-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - hyperlofy-network

networks:
  hyperlofy-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
